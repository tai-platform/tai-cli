name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. auto reads conventional commits since the last tag.
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only show the next version and notes, publish nothing.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: next
        run: |
          version="$(node scripts/next-version.mjs --bump "${{ inputs.bump }}" --notes notes.md)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          { echo "## Next version: v${version}"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  publish:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - run: npm ci
      - run: npm pkg set version="${{ needs.plan.outputs.version }}"
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and publish the GitHub release
        run: gh release create "v${{ needs.plan.outputs.version }}" --target "${GITHUB_SHA}" --title "v${{ needs.plan.outputs.version }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
